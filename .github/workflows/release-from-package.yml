name: Release From Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional explicit version; must match package.json when provided
        required: false
        type: string
      target:
        description: Target branch or commit SHA for the tag
        required: false
        default: main
        type: string

permissions:
  contents: write

jobs:
  node-quality:
    name: Node Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: node-quality
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.target }}

      - name: Resolve version from package.json
        id: version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ -n "${EXPECTED_VERSION}" ] && [ "${EXPECTED_VERSION}" != "${VERSION}" ]; then
            echo "provided version ${EXPECTED_VERSION} does not match package.json version ${VERSION}"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Ensure release tag does not already exist
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists."
            exit 1
          fi

      - name: Create GitHub release from package version
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ inputs.target }}
          generate_release_notes: true
